# aaagent default configuration.
# Override any value in ~/.config/aaagent/config.toml (user-wide)
# or <project>/.aaagent/config.toml (one project). Later files win.

[orchestrator]
# Claude Code model alias or full model id used for planning and review.
model = "opus"
# Path to the claude binary. Empty = auto-detect (PATH, ~/.local/bin, VSCode extension).
claude_bin = ""
# Extra arguments passed to claude, e.g. ["--effort", "high"].
extra_args = []
# Thinking level (claude --effort): low | medium | high | xhigh | max. Empty = Claude Code's default. An --effort in extra_args wins.
thinking = ""

[workers]
# Path to the opencode binary. Empty = "opencode" on PATH.
opencode_bin = ""
# Path to the claude binary for workers that run on Claude Code. Empty = the orchestrator's.
claude_bin = ""
# opencode agents installed by install.sh
implement_agent = "aaagent-worker"
commit_agent = "aaagent-committer"
review_agent = "aaagent-reviewer"

# Workers are generic slots: worker1, worker2, worker3, …, and any of them may run any
# model. The two tables below are only a starting set, used while neither the user config
# (~/.config/aaagent/config.toml) nor the project config (<project>/.aaagent/config.toml)
# defines any worker of its own. `aaagent workers add|remove` edits the list.
[workers.worker1]
model = "opencode-go/deepseek-v4.1-flash"
# Thinking level (opencode model variant), e.g. low | high | max. Empty = the model's default.
thinking = ""

[workers.worker2]
model = "opencode-go/glm-5.3-flash"
# Thinking level (opencode model variant), e.g. low | high | max. Empty = the model's default.
thinking = ""

# A worker runs on opencode when its model id has a slash (provider/model) and on headless
# Claude Code (`claude -p`) when it is a Claude model name (sonnet, opus, haiku, claude-…).
# Set `backend = "opencode"` or `backend = "claude"` to say so explicitly. Example:
# [workers.claude]
# model = "sonnet"
# thinking = ""          # claude --effort: low | medium | high | xhigh | max

[flow]
# Worker that implements plans unless the plan or --worker says otherwise.
# Empty = the first worker in the list.
default_worker = ""
# Worker that takes over when the default one fails or keeps failing review.
# Empty = the worker after the default one in the list (or the default itself when
# there is only one worker, which means no fallback).
fallback_worker = ""
# Stop and ask the user after this many implement/fix rounds without approval.
max_review_rounds = 3
# Hand the task to the fallback worker after this many rejected reviews in a row.
fallback_after_failed_reviews = 2
# Kill a worker job that runs longer than this.
job_timeout_minutes = 30
# Who reviews each round is configured in [reviewer] below. (An old
# `reviewer = "<worker>"` value here still works; setting the reviewer again clears it.)

[reviewer]
# Who reviews each round.
# "planner" = the chat (the planner) reviews each round itself.
# A model = a separate reviewer runs each review as a job: a Claude model name
# (sonnet, opus, …) runs on headless Claude Code, an opencode id (provider/model) on opencode.
# With a reviewer model, one dispatch runs implement → review → fix … until approval;
# the planner still gives the final go for the commit.
model = "planner"
# Thinking level: claude --effort for a Claude model, the opencode variant otherwise. Empty = default.
thinking = ""
# How many reviews the reviewer runs at the same time (1–8). Raise it when several tasks run in
# parallel, so their reviews do not wait for each other.
parallel = 1
# backend = "opencode" | "claude"   # optional; inferred from the model like workers

[git]
# false = .aaagent/ is listed in .git/info/exclude and never committed.
track_agent_dir = false
# Where tasks commit: "current" = the checked-out branch; "branch" = a new branch per batch of
# tasks (feat/…, fix/…); "pr" = like "branch", then push it and open a pull request (gh) when
# the last task of the batch is committed; "pr-auto" = like "pr", but the planner opens the
# pull request without asking and the chat restarts afterwards. The checkout stays on the
# new branch.
# "none" = No Git (aaagent keeps its own history in .aaagent/shadow.git)
branch_mode = "current"

[integration]
# Shell command run in the project after the last task of a branch is committed, and again before
# `aaagent pr` / `aaagent branch-done` when it has not passed for the current commit. A failure
# stops the pull request; the planner plans a fix task instead. Empty = no check.
# Example: command = "python3 -m unittest discover -s tests -q"
command = ""
timeout_minutes = 20

[check]
# Command aaagent runs itself in the task's tree after every implement/fix round, before the
# review. "" = the [integration] command. Both empty = no check.
command = ""
# Set to false to turn the check off even when a command is set.
enabled = true
# What a failing check does. "review" = the review runs as usual and the reviewer sees the
# result. "fix" = no review job: aaagent writes review-N.md with changes_requested and the
# output, so the next round is a fix (use it when the suite is green on the base branch).
on_fail = "review"
# 0 = [integration] timeout_minutes.
timeout_minutes = 0

[parallel]
# How tasks that run at the same time share the project.
# "shared"   = every task works in the project's own working tree; tasks that run at the same
#              time must declare disjoint `files:`.
# "worktree" = each task gets its own git worktree and branch (aaagent/<task>) under `dir`, so its
#              tests run in isolation; its commit is applied to the project's branch afterwards.
#              Needs git (not No Git) and [git] track_agent_dir = false; otherwise "shared" is used.
isolation = "shared"
# Where the worktrees go. A relative path is relative to the project.
dir = ".aaagent/worktrees"
# Untracked folders or files the project needs to run (a virtualenv, node_modules, .env), linked
# into each new worktree when they exist in the project.
links = []
# Shell command run once in each new worktree, e.g. "npm ci". Empty = none.
setup = ""
